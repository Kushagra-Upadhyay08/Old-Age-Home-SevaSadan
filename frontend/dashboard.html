<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Ashaktashram Dakor</title>
  <meta name="description" content="Management Dashboard for Shantilal Mohanlal Ashaktashram Society">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // Fallback: if jsPDF didn't load from cdnjs, try unpkg
    if (!window.jspdf) {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';
      document.head.appendChild(s);
    }
  </script>
</head>
<body class="dashboard-body">

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 48 48" width="32" height="32">
        <circle cx="24" cy="24" r="22" fill="none" stroke="var(--color-primary)" stroke-width="2"/>
        <path d="M24 8v32M8 24h32M13 13l22 22M13 35l22-22" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <circle cx="24" cy="24" r="3" fill="var(--color-primary)"/>
      </svg>
      <span class="sidebar-brand-text">Ashaktashram</span>
    </div>

    <nav class="sidebar-nav">
      <!-- Servant-only items -->
      <div id="nav-servant-section" class="nav-section">
        <span class="nav-section-label">
          <span class="display-lang-en">Forms</span>
          <span class="display-lang-gu" style="display:none;">ફોર્મ</span>
        </span>
        <a href="#" class="nav-item" data-view="admission-form" id="nav-admission">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span class="display-lang-en">Admission Form</span>
          <span class="display-lang-gu" style="display:none;">પ્રવેશ ફોર્મ</span>
        </a>
        <a href="#" class="nav-item" data-view="donation-form" id="nav-donation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="display-lang-en">Donation Receipt</span>
          <span class="display-lang-gu" style="display:none;">દાન રસીદ</span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-section-label">
          <span class="display-lang-en">Records</span>
          <span class="display-lang-gu" style="display:none;">રેકોર્ડ</span>
        </span>
        <a href="#" class="nav-item" data-view="view-forms" id="nav-view-forms">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span class="display-lang-en">Forms</span>
          <span class="display-lang-gu" style="display:none;">ફોર્મ</span>
        </a>
        <a href="#" class="nav-item" data-view="view-donations" id="nav-view-donations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span class="display-lang-en">Donation Receipts</span>
          <span class="display-lang-gu" style="display:none;">દાન રસીદો</span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-section-label">
          <span class="display-lang-en">Account</span>
          <span class="display-lang-gu" style="display:none;">એકાઉન્ટ</span>
        </span>
        <a href="#" class="nav-item" data-view="settings" id="nav-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="display-lang-en">Settings</span>
          <span class="display-lang-gu" style="display:none;">સેટિંગ્સ</span>
        </a>
        <a href="#" class="nav-item nav-item-logout" id="nav-logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="display-lang-en">Logout</span>
          <span class="display-lang-gu" style="display:none;">લોગ આઉટ</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Mobile sidebar toggle -->
  <button id="sidebar-toggle" class="sidebar-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Main Content Area -->
  <main class="dashboard-main">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <h2 id="page-title" class="page-title">Dashboard</h2>
      </div>
      <div class="topbar-right">
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme">
          <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="lang-toggle-btn" class="icon-btn" title="Toggle language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        <div class="user-badge" id="user-badge">
          <div class="user-avatar" id="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name" id="user-name">User</span>
            <span class="user-role" id="user-role-badge">role</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Content Views (switched via JS) -->
    <div class="content-area" id="content-area">
      <!-- Views are rendered dynamically by app.js -->
      <div class="loading-spinner" id="content-loading">
        <div class="spinner-lg"></div>
      </div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Details</h3>
        <button id="modal-close" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-download-pdf" class="button-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span class="display-lang-en">Download PDF</span>
          <span class="display-lang-gu" style="display:none;">PDF ડાઉનલોડ</span>
        </button>
      </div>
    </div>
  </div>

  <script src="config.js?v=2.1"></script>
  <script src="app.js?v=2.1"></script>
</body>
</html>
