<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ashaktashram Dakor</title>
  <meta name="description" content="Login portal for Shantilal Mohanlal Ashaktashram Society, Dakor">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-bg-animation">
    <div class="login-orb orb-1"></div>
    <div class="login-orb orb-2"></div>
    <div class="login-orb orb-3"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 48 48" width="48" height="48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="var(--color-primary)" stroke-width="2"/>
            <path d="M24 8v32M8 24h32M13 13l22 22M13 35l22-22" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
            <circle cx="24" cy="24" r="6" fill="var(--color-primary)" opacity="0.2"/>
            <circle cx="24" cy="24" r="3" fill="var(--color-primary)"/>
          </svg>
        </div>
        <h1 class="login-title">
          <span class="display-lang-en">Ashaktashram Dakor</span>
          <span class="display-lang-gu" style="display:none;">અશક્તાશ્રમ ડાકોર</span>
        </h1>
        <p class="login-subtitle">
          <span class="display-lang-en">Shantilal Mohanlal Ashaktashram Society</span>
          <span class="display-lang-gu" style="display:none;">શાંતિલાલ મોહનલાલ અશક્તાશ્રમ સોસાયટી</span>
        </p>
      </div>

      <form id="login-form" novalidate>
        <div class="login-form-group">
          <label for="login-username">
            <span class="display-lang-en">Username</span>
            <span class="display-lang-gu" style="display:none;">યુઝરનેમ</span>
          </label>
          <div class="input-icon-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="login-username" name="username" placeholder="Enter username" autocomplete="username" required>
          </div>
        </div>

        <div class="login-form-group">
          <label for="login-password">
            <span class="display-lang-en">Password</span>
            <span class="display-lang-gu" style="display:none;">પાસવર્ડ</span>
          </label>
          <div class="input-icon-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-password" name="password" placeholder="Enter password" autocomplete="current-password" required>
          </div>
        </div>

        <div id="login-error" class="login-error" style="display:none;"></div>

        <button type="submit" id="login-btn" class="login-submit-btn">
          <span class="display-lang-en">Sign In</span>
          <span class="display-lang-gu" style="display:none;">લોગ ઇન</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="login-footer">
        <button id="login-lang-btn" class="lang-toggle-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="login-lang-text">ગુજરાતી</span>
        </button>
      </div>
    </div>

    <p class="login-copyright">© 2026 Shantilal Mohanlal Ashaktashram Society</p>
  </div>

  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
